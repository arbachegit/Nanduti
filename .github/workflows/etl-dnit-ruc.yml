name: etl-dnit-ruc

on:
  schedule:
    - cron: '0 6 * * *'   # diário 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem escrever no Supabase'
        required: false
        default: 'false'
      ruc_list:
        description: 'CSV de RUCs a consultar (sobrescreve seed)'
        required: false
        default: ''

concurrency:
  group: etl-dnit-ruc
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DNIT_API_KEY: ${{ secrets.DNIT_API_KEY }}
          DNIT_RUC_LIST: ${{ github.event.inputs.ruc_list }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m dnit_ruc.run

      - name: Notify Slack on failure
        if: failure() && env.SLACK_ETL_WEBHOOK != ''
        env:
          SLACK_ETL_WEBHOOK: ${{ secrets.SLACK_ETL_WEBHOOK }}
        run: |
          curl -s -X POST -H 'content-type: application/json' \
            -d "{\"text\":\"❌ etl-dnit-ruc falhou em run ${{ github.run_id }}\"}" \
            "$SLACK_ETL_WEBHOOK"

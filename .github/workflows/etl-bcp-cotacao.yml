name: etl-bcp-cotacao

on:
  schedule:
    - cron: '7 * * * *'   # cada hora aos 7 minutos
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem escrever no Supabase'
        required: false
        default: 'false'

concurrency:
  group: etl-bcp-cotacao
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m bcp.run

      - name: Notify Slack on failure
        if: failure() && env.SLACK_ETL_WEBHOOK != ''
        env:
          SLACK_ETL_WEBHOOK: ${{ secrets.SLACK_ETL_WEBHOOK }}
        run: |
          curl -s -X POST -H 'content-type: application/json' \
            -d "{\"text\":\"❌ etl-bcp-cotacao falhou em run ${{ github.run_id }}\"}" \
            "$SLACK_ETL_WEBHOOK"

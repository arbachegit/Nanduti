name: etl-dinac-clima

on:
  schedule:
    - cron: '13 * * * *'   # cada hora aos 13min (DINAC atualiza ~6×/dia)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem escrever no Supabase'
        required: false
        default: 'false'

concurrency:
  group: etl-dinac-clima
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m dinac.run

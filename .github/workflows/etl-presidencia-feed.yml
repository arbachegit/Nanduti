name: etl-presidencia-feed

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 minutos
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem escrever no Supabase'
        required: false
        default: 'false'

concurrency:
  group: etl-presidencia-feed
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m presidencia.run

      - name: Notify Slack on failure
        if: failure() && env.SLACK_ETL_WEBHOOK != ''
        env:
          SLACK_ETL_WEBHOOK: ${{ secrets.SLACK_ETL_WEBHOOK }}
        run: |
          curl -s -X POST -H 'content-type: application/json' \
            -d "{\"text\":\"❌ etl-presidencia-feed falhou em run ${{ github.run_id }}\"}" \
            "$SLACK_ETL_WEBHOOK"

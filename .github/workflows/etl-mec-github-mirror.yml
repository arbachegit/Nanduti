name: etl-mec-github-mirror

on:
  schedule:
    - cron: '0 4 * * 0'   # domingo 04:00 UTC, semanal
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem escrever no Supabase'
        required: false
        default: 'false'

concurrency:
  group: etl-mec-github-mirror
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m mec_github.run

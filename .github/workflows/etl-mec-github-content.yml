name: etl-mec-github-content

on:
  schedule:
    - cron: '30 4 * * 0'   # domingo 04:30 UTC, semanal (depois do mirror)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem escrever no Supabase'
        required: false
        default: 'false'
      repo_limit:
        description: 'Máximo de repos a processar'
        required: false
        default: '10'

concurrency:
  group: etl-mec-github-content
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEC_GITHUB_REPO_LIMIT: ${{ github.event.inputs.repo_limit || '10' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m mec_github.run_content

      - name: Notify Slack on failure
        if: failure() && env.SLACK_ETL_WEBHOOK != ''
        env:
          SLACK_ETL_WEBHOOK: ${{ secrets.SLACK_ETL_WEBHOOK }}
        run: |
          curl -s -X POST -H 'content-type: application/json' \
            -d "{\"text\":\"❌ etl-mec-github-content falhou em run ${{ github.run_id }}\"}" \
            "$SLACK_ETL_WEBHOOK"

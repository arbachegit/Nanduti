# DigitalOcean App Platform spec for Ñandutí
# Deploy: doctl apps create --spec .do/app.yaml
# Update: doctl apps update <app-id> --spec .do/app.yaml
name: nanduti
region: nyc
features:
  - buildpack-stack=ubuntu-22

services:
  - name: web
    github:
      repo: arbachegit/iconsaiNanduti
      branch: main
      deploy_on_push: true

    source_dir: /
    build_command: npm ci && npm run build && cp -r public .next/standalone/ && mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/
    run_command: node .next/standalone/server.js
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 3000

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      # ── Public (build-time + runtime) ──
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://qgzkphojxxenvoukjxjz.supabase.co

      # ── Secrets (runtime only, encrypted) ──
      - key: SUPABASE_ANON_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${SUPABASE_ANON_KEY}"

      - key: SUPABASE_SERVICE_ROLE
        scope: RUN_TIME
        type: SECRET
        value: "${SUPABASE_SERVICE_ROLE}"

      - key: DO_INFERENCE_BASE_URL
        scope: RUN_TIME
        value: https://inference.do-ai.run/v1

      - key: DO_INFERENCE_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${DO_INFERENCE_KEY}"

      - key: LLM_MODEL_FAST
        scope: RUN_TIME
        value: anthropic-claude-3.5-haiku

      - key: LLM_MODEL_DEEP
        scope: RUN_TIME
        value: anthropic-claude-sonnet-4

      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${OPENAI_API_KEY}"

      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${ANTHROPIC_API_KEY}"

      - key: INFOBIP_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${INFOBIP_API_KEY}"

      - key: INFOBIP_BASE_URL
        scope: RUN_TIME
        value: https://5589kd.api.infobip.com

      - key: INFOBIP_SMS_FROM
        scope: RUN_TIME
        value: "447860088532"

      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${RESEND_API_KEY}"

      - key: RELIEFWEB_APPNAME
        scope: RUN_TIME
        value: nanduti.iconsai.ai

      - key: DEMO_MODE
        scope: RUN_TIME
        value: "true"
